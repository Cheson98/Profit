plugins {
    id 'com.android.application'
}

// De bouw op GitHub geeft elk versienummer door (oplopend), zodat een nieuwe versie
// altijd over de vorige heen te installeren is. Lokaal bouwen gebruikt 1 / 1.0.
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def appVersionName = (project.findProperty('appVersionName') ?: '1.0').toString()

android {
    namespace 'com.q8trainer.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.q8trainer.app'
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    // Vaste sleutel (app/debug.keystore), zodat een nieuwe versie altijd over de
    // vorige heen te installeren is en je gegevens behouden blijven.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
