plugins {
    id 'com.android.application'
}

android {
    namespace 'com.q8trainer.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.q8trainer.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Vaste sleutel (app/debug.keystore), zodat een nieuwe versie altijd over de
    // vorige heen te installeren is en je gegevens behouden blijven.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
