name: Bouw APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test herinneringen (Java)
        run: |
          mkdir -p tests/out
          javac -d tests/out app/src/main/java/com/q8trainer/app/ReminderMath.java tests/ReminderMathTest.java
          java -cp tests/out com.q8trainer.app.ReminderMathTest

      - name: Test normen, timers en resultaten (JavaScript)
        run: |
          if [ -f tests/js-tests.js ]; then node tests/js-tests.js; else echo "Geen JavaScript-tests gevonden"; fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Bouw APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Geef de APK een duidelijke naam
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Q8-Oefentest.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: Q8-Oefentest-apk
          path: dist/Q8-Oefentest.apk
          if-no-files-found: error

      - name: Publiceer als release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" dist/Q8-Oefentest.apk \
            --target "$GITHUB_SHA" \
            --title "Q8 Oefentest $TAG" \
            --notes "Download **Q8-Oefentest.apk** hieronder en open het bestand op je Android-telefoon. Zie de README voor de installatie." \
            --latest
